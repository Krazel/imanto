name: Imanto TestFlight
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Standard free public runner; macos-15 is a capacity fallback with Xcode 26.3'
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-26-intel
        default: macos-26
      qa_run_id:
        description: 'Optional successful native QA run; shipping source and test harness must match exactly'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: imanto-testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository == 'Krazel/imanto' && github.event.repository.private == false && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    environment: app-store-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26 on the fallback runner
        if: inputs.runner == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci && npm test && npm run build:ios
      - run: brew install xcodegen && cd ios && xcodegen generate --spec project.ads.yml
      - run: node scripts/ad-inventory-qa.mjs && node scripts/ad-project-qa.mjs
      - name: Native offline, audio and gameplay tests on iPhone and iPad
        if: inputs.qa_run_id == ''
        run: node scripts/native-qa.mjs
      - name: Verify successful native QA for identical shipping source
        if: inputs.qa_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
        run: node scripts/verify-native-qa.mjs
      - name: Sign, validate and upload owner-authorized beta
        env:
          IMANTO_DISTRIBUTION: testflight
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: node scripts/build-testflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Imanto-0.25-build1-${{ github.sha }}
          path: |
            artifacts/testflight/
            artifacts/qa/
          retention-days: 1
