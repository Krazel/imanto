name: Imanto commercial candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit authorized commercial version (for example 1.0)'
        type: string
        required: true
      build:
        description: 'Unused build number for that version'
        type: string
        required: true
      upload:
        description: 'Upload candidate to App Store Connect; does not submit or release'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: imanto-app-store
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'Krazel/imanto' && github.event.repository.private == false && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: app-store-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run build:ios
      - run: brew install xcodegen
      - run: node scripts/ad-inventory-qa.mjs && node scripts/ad-project-qa.mjs
      - run: node scripts/native-qa.mjs
      - name: Archive and validate commercial inventory; upload only if selected
        env:
          IMANTO_DISTRIBUTION: app-store
          IMANTO_MARKETING_VERSION: ${{ inputs.version }}
          IMANTO_BUILD_NUMBER: ${{ inputs.build }}
          IMANTO_UPLOAD: ${{ inputs.upload }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          if [ "$IMANTO_UPLOAD" = "true" ]; then
            node scripts/build-app-store.mjs --upload
          else
            node scripts/build-app-store.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Imanto-AppStore-${{ github.sha }}
          path: |
            artifacts/app-store/
            artifacts/qa/
          retention-days: 1
