<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7eb">
  <title>Imanto · Sensaciones</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="feel-lab.css">
</head>
<body>
  <main>
    <header class="topbar">
      <a class="back" href="./" data-text="back">‹ Imanto</a>
      <div class="language" aria-label="Language"><button data-lang="es" lang="es">ES</button><button data-lang="en" lang="en">EN</button></div>
    </header>
    <section class="intro">
      <p class="eyebrow" data-text="eyebrow">IMANTO · LABORATORIO</p>
      <h1 data-text="title">Tres formas de sentir Imanto</h1>
      <p class="lead" data-text="intro">Coloca, completa una línea y compara. Tú eliges qué sensación encaja mejor.</p>
    </section>
    <div class="soundbar">
      <button id="sound" aria-pressed="true"><span class="sound-icon" aria-hidden="true">♪</span><span data-text="soundOn">Sonido activado</span></button>
      <label for="volume" data-text="volume">Volumen</label><input id="volume" type="range" min="0" max="100" value="65">
      <span class="gesture-note" data-text="gesture">El sonido empieza al pulsar una prueba.</span>
    </div>
    <div id="cards" class="cards"></div>
    <p id="audio-status" class="audio-status" role="status" aria-live="polite"></p>
    <footer>
      <p data-text="proposal">Son propuestas para comparar. Probarlas no cambia tu partida ni guarda una elección.</p>
      <details><summary data-text="credits">Sonidos y créditos</summary><div id="credits"></div></details>
    </footer>
    <noscript>Activa JavaScript para probar las animaciones. / Enable JavaScript to try the animations.</noscript>
  </main>
  <script type="module" src="feel-lab.mjs"></script>
</body>
</html>
