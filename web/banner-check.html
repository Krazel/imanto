<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imanto · prueba de banner</title><style>body{font:16px/1.5 system-ui;background:#f6eddf;color:#432611;margin:20px}main{max-width:820px;margin:auto}label{display:inline-block;padding:10px}button{padding:12px;border:1px solid #cfaf74;border-radius:12px;background:#edb137;font:inherit}#phone{position:relative;width:min(390px,100%);height:780px;border:1px solid #ccb48b;border-radius:18px;overflow:hidden;margin:16px 0}iframe{width:100%;height:100%;border:0}.banner{position:absolute;bottom:0;left:0;right:0;height:90px;display:grid;place-items:center;background:#eee;border-top:1px solid #aaa;color:#444;text-align:center;font-size:12px}.banner[hidden]{display:none}output{display:block;font-weight:700}</style><main><h1>El tablero se queda en su sitio</h1><p>Simulación visual local del espacio del banner. No carga publicidad real.</p><label><input id="banner-toggle" type="checkbox"> Mostrar banner</label><button id="compare">Comparar posiciones</button><output id="result">Preparando tablero…</output><div id="phone"><iframe id="game" title="Imanto en pantalla de móvil" src="/?lang=es"></iframe><div class="banner" id="banner" hidden>BANNER DE PRUEBA · 90 px</div></div><a href="/?screen=pause&lang=es">Ver pausa con Quitar anuncios</a></main><script>
const frame=document.querySelector('#game'),toggle=document.querySelector('#banner-toggle'),result=document.querySelector('#result');
function apply(){const root=frame.contentDocument.documentElement;root.style.setProperty('--imanto-banner-height',toggle.checked?'90px':'0px');root.toggleAttribute('data-banner-visible',toggle.checked);document.querySelector('#banner').hidden=!toggle.checked;}
function rects(){return ['.heading','#score','#board','#tray','.forecast'].map(s=>{const r=frame.contentDocument.querySelector(s).getBoundingClientRect();return [s,r.x,r.y,r.width,r.height]});}
toggle.onchange=apply;document.querySelector('#compare').onclick=()=>{toggle.checked=false;apply();const before=rects();toggle.checked=true;apply();const after=rects();result.textContent=JSON.stringify(before)===JSON.stringify(after)?'Sin desplazamiento: título, puntos, tablero y fichas conservan posición y tamaño.':'Hay una diferencia de posición.';result.dataset.before=JSON.stringify(before);result.dataset.after=JSON.stringify(after);};frame.onload=()=>{result.textContent='Listo para comparar.';apply();};
</script></html>
