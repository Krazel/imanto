*{box-sizing:border-box}body{margin:0;background:#fff7eb;color:#432611;font-family:'Trebuchet MS',Arial,sans-serif}.shell{max-width:1120px;margin:auto;padding:30px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:23px;border-bottom:1px solid #e8d3b5}.eyebrow{font-size:11px;letter-spacing:.06em;color:#795f49}h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:11px 0 13px}header p{max-width:690px;line-height:1.6;font-size:15px;margin:0}a{color:inherit}.back{flex:none;min-height:44px;padding:12px 16px;text-decoration:none;border:1px solid #d4b995;border-radius:25px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:25px}.card{background:#fffbf3;border:1px solid #e5d1b2;border-radius:23px;padding:22px;min-width:0}.kind{font-size:11px;color:#795f49}.wordmark{font-family:'Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-weight:1000;font-size:clamp(35px,4.4vw,47px);letter-spacing:-.025em;line-height:1.1;margin:23px 0 18px}.swatches{display:flex;gap:5px;margin-bottom:19px}.swatches i{width:26px;height:26px;border-radius:6px;box-shadow:inset 0 1px #fff5}.swatches i:nth-child(1),.swatches i:nth-child(5){background:#278a91}.swatches i:nth-child(2){background:#f46b50}.swatches i:nth-child(3){background:#edb137}.swatches i:nth-child(4){background:#927fb6}.card p{font-size:13px;line-height:1.5;min-height:40px;color:#795f49;margin:0 0 19px}.preview{display:flex;align-items:center;justify-content:center;min-height:46px;background:#432611;color:#fffaf1;border-radius:24px;text-decoration:none;font-size:13px;font-weight:bold}.note{font-size:13px;line-height:1.6;color:#795f49;margin:23px 0 0}a:focus-visible{outline:3px solid #247e84;outline-offset:4px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wordmark{font-size:40px}}@media(max-width:480px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.shell{padding:23px 18px}.wordmark{font-size:46px}.card p{min-height:0}}
</style></head><body><main class="shell"><header><div><span class="eyebrow">CÁLIDO · MISMO JUEGO, DISTINTOS NOMBRES</span><h1>Imanto · nombre elegido</h1><p>Archivo de las seis pruebas anteriores. El nombre definitivo elegido es Imanto.</p></div><a class="back" href="/">Volver al juego</a></header><section id="names" class="grid" aria-label="Seis pruebas de nombre"></section><p class="note">Archivo histórico: el juego usa Imanto. El diseño cálido y tu partida se conservan.</p></main><script type="module">
import {NAME_OPTIONS} from './names.mjs';
const list=document.querySelector('#names');
for(const [i,option] of NAME_OPTIONS.entries()){
  const card=document.createElement('article');card.className='card';
  const kind=document.createElement('span');kind.className='kind';kind.textContent=`${i+1} · ${option.kind}`;
  const title=document.createElement('h2');title.className='wordmark';title.textContent=option.name.toUpperCase();
  const swatches=document.createElement('div');swatches.className='swatches';swatches.setAttribute('aria-hidden','true');for(let n=0;n<5;n++)swatches.append(document.createElement('i'));
  const copy=document.createElement('p');copy.textContent=option.copy;
  const link=document.createElement('a');link.className='preview';link.href='/?name='+option.id;link.textContent='Ver en el juego ↗';link.setAttribute('aria-label','Probar '+option.name+' en el juego');
  card.append(kind,title,swatches,copy,link);list.append(card);
}
</script></body></html>
