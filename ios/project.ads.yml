# Development and TestFlight inventory. Ordinary project.yml remains SDK-free.
# The separate project.store.yml selects real units for a commercial archive.
include:
  - project.yml
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  Imanto:
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        INFOPLIST_FILE: App/Info.ads.plist
        IMANTO_ADS_MODE: demo
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) IMANTO_TESTFLIGHT
        OTHER_LDFLAGS: $(inherited) -ObjC
