name: Imanto
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    MARKETING_VERSION: '0.15'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Imanto:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Web
        type: folder
        buildPhase: resources
      - path: Audio
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krazel.imanto
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ImantoTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: Imanto
schemes:
  Imanto:
    build:
      targets:
        Imanto: all
    test:
      targets:
        - ImantoTests
